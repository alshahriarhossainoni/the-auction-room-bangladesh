<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | TAR Bangladesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&family=Playfair+Display:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=11">
</head>
<body class="auth-page">

<div class="auth-shell">
  <aside class="auth-brand-panel">
    <img src="logo.jpg" alt="TAR Bangladesh">
    <h1>Welcome back.</h1>
    <p>Access your TAR Bangladesh account and continue your learning journey.</p>
    <a class="back-home" href="index.html">← Back to Home</a>
  </aside>
  <main class="auth-form-panel">
    <h2>Log In</h2>
    <p class="auth-subtitle">Use your registered email and password.</p>
    <div class="auth-message" id="authMessage"></div>
    <form id="loginForm">
      <div class="form-group"><label>Email</label><input id="email" type="email" autocomplete="email" required></div>
      <div class="form-group"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="auth-submit" type="submit">Log In</button>
    </form>
    <p class="auth-helper">Don't have an account? <a href="signup.html">Sign Up</a></p>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
</body></html>
