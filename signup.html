<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up | TAR Bangladesh</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Sans+Bengali:wght@400;500;600;700&amp;family=Noto+Serif+Bengali:wght@500;600;700&amp;family=Playfair+Display:wght@600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="styles.css?v=11" rel="stylesheet"/>
<link href="tar-network-bg.css?v=3" rel="stylesheet"/>
<link href="tar-institutional.css?v=1" rel="stylesheet">
<link href="tar-redesign-v2.css?v=2" rel="stylesheet">
</link></link><meta content="noindex, nofollow" name="robots"/></head>
<body class="auth-page">
<div class="auth-shell">
<aside class="auth-brand-panel">
<img alt="TAR Bangladesh" src="logo.jpg"/>
<h1>Create your account.</h1>
<p>Join TAR Bangladesh with a secure account powered by Supabase Auth.</p>
<a class="back-home" href="index.html">← Back to Home</a>
</aside>
<main class="auth-form-panel">
<h2>Sign Up</h2>
<p class="auth-subtitle">Create your TAR Bangladesh account.</p>
<div class="auth-message" id="authMessage"></div>
<form id="signupForm">
<div class="form-group"><label>Full Name</label><input autocomplete="name" id="fullName" required="" type="text"/></div>
<div class="form-group"><label>Email</label><input autocomplete="email" id="email" required="" type="email"/></div>
<div class="form-group"><label>Password</label><input autocomplete="new-password" id="password" minlength="8" required="" type="password"/></div>
<button class="auth-submit" type="submit">Create Account</button>
</form>
<p class="auth-helper">Already registered? <a href="login.html">Log In</a></p>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script defer="" src="tar-network-bg.js?v=3"></script>
</body></html>
